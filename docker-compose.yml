name: gorev-yoneticisi

services:
  # ==========================================
  # VERİTABANI SERVİSLERİ
  # ==========================================
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Apple Silicon (arm64) uyumu: imaj yalnızca amd64 için yayınlanıyor,
    # Docker Desktop > Settings > General > "Use Rosetta" açık olmalıdır.
    platform: linux/amd64
    container_name: gorev-yoneticisi-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      # Yalnızca bu makineye bağlanır. "1433:1433" yazılsaydı port
      # 0.0.0.0'a açılır ve aynı ağdaki herkes veritabanına doğrudan,
      # uygulamanın kimlik doğrulamasını atlayarak bağlanmayı deneyebilirdi.
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - uygulama-agi
    healthcheck:
      # Tools yolu imaj sürümüne göre değişebildiği için iki yol da denenir.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: gorev-yoneticisi-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      # Bkz. mssql: veritabanı portu dışarı açılmaz.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - uygulama-agi
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ==========================================
  # UYGULAMA SERVİSLERİ
  # ==========================================
  backend:
    build: ./backend
    container_name: gorev-yoneticisi-backend
    environment:
      # Python çıktısını tamponlamaz; print/log satırları anında görünür.
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      mssql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - uygulama-agi
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: gorev-yoneticisi-frontend
    environment:
      # Tarayıcıda çalıştığı için compose ağını değil, host portunu kullanır.
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - uygulama-agi
    restart: unless-stopped

# ==========================================
# AĞ VE KALICI DEPOLAMA
# ==========================================
networks:
  uygulama-agi:
    driver: bridge

volumes:
  mssql-data:
  mongo-data:
